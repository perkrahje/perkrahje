<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e0e10">
  <meta name="description" content="Restorantet dhe ofertat e ditës pranë teje — perkrahje.com">
  <title>Ofertat E Ditës · perkrahje.com</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0e0e10;
      --text: #ececec;
      --subtle: #8a8a8a;
      --line: #2a2a2a;
    }

    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: 520px;
      width: 90vw;
      padding: clamp(56px, 12vh, 140px) 0 72px;
      opacity: 0;
      transform: translateY(16px);
      animation: appear 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    .tag {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 0.18em;
      color: var(--subtle);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .name {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 200;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 14px;
    }

    .tagline {
      font-size: 0.9rem;
      font-weight: 300;
      color: var(--subtle);
      letter-spacing: 0.01em;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .rule {
      width: 100%;
      height: 1px;
      background: var(--line);
      margin-bottom: 18px;
    }

    .statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 24px;
      margin-bottom: 4px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      font-weight: 300;
      color: var(--subtle);
      letter-spacing: 0.04em;
      overflow-wrap: anywhere;
    }

    .status a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 1px;
      transition: border-color 0.25s ease;
    }

    .status a:hover { border-color: var(--text); }

    .refresh {
      font-family: 'DM Mono', monospace;
      font-size: 0.9rem;
      color: var(--subtle);
      text-decoration: none;
      padding: 0 2px;
      flex-shrink: 0;
      transition: color 0.25s ease;
    }

    .refresh:hover { color: var(--text); }

    .list { width: 100%; }

    .place {
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .place-top {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .place-name {
      flex: 1;
      min-width: 0;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-bottom: 1px solid transparent;
      padding-bottom: 1px;
      transition: border-color 0.25s ease;
    }

    .place-name:hover { border-color: var(--text); }

    .dist {
      flex-shrink: 0;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      font-weight: 300;
      color: var(--subtle);
      letter-spacing: 0.04em;
    }

    .place-meta {
      margin: 6px 0 0 18px;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      font-weight: 300;
      color: var(--subtle);
      letter-spacing: 0.03em;
      line-height: 1.5;
    }

    .offer {
      display: inline-block;
      margin: 8px 0 0 18px;
      padding: 3px 8px;
      border: 1px solid var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      font-weight: 300;
      color: var(--text);
      letter-spacing: 0.04em;
      line-height: 1.4;
    }

    .offer-label {
      color: var(--subtle);
      margin-right: 6px;
    }

    .place-addr {
      margin: 5px 0 0 18px;
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      font-weight: 300;
      color: var(--subtle);
      opacity: 0.75;
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty {
      padding: 20px 0;
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      font-weight: 300;
      color: var(--subtle);
      letter-spacing: 0.04em;
    }

    .note {
      margin-top: 14px;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      font-weight: 300;
      color: var(--subtle);
      opacity: 0.6;
      letter-spacing: 0.04em;
      line-height: 1.6;
    }

    .footer { margin-top: 26px; }

    .footer a {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      font-weight: 300;
      color: var(--subtle);
      text-decoration: none;
      letter-spacing: 0.06em;
      border-bottom: 1px solid transparent;
      padding-bottom: 1px;
      transition: border-color 0.25s ease;
    }

    .footer a:hover { border-color: var(--subtle); }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text);
      flex-shrink: 0;
    }

    .dot.hollow {
      background: transparent;
      border: 1px solid var(--subtle);
    }

    .dot.pulse { animation: pulse 1.1s ease-in-out infinite; }

    @keyframes appear {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: none; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="tag">— Ushqim Afer</div>
    <h1 class="name">Ofertat E Ditës</h1>
    <p class="tagline">Restorantet rreth teje dhe oferta e ditës për secilin.</p>

    <div class="rule"></div>

    <div class="statusbar">
      <div class="status" id="status"></div>
      <a href="#" class="refresh" id="refresh" title="rifresko">↺</a>
    </div>

    <div class="list" id="list"></div>

    <div class="note" id="note" hidden>
      — ofertat janë demonstruese; konfero me restorantin · të dhëna © OpenStreetMap
    </div>

    <div class="footer">
      <a href="/">← perkrahje.com</a>
      <a href="/cka-po-hajme-sot.html" style="margin-left:16px">cka po hajme sot?</a>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      // Shtresa e të dhënave: OpenStreetMap përmes Overpass API — pa çelës, pa kosto.
      const OVERPASS_URLS = [
        'https://overpass-api.de/api/interpreter',
        'https://overpass.kumi.systems/api/interpreter'
      ];

      const RADIUS_M = 1500;
      const MAX_RESULTS = 20;
      const AMENITIES = ['restaurant', 'fast_food', 'cafe'];

      const OFFERS = [
        '-20% në gjithçka',
        '2 për 1 — pizza',
        'dreka €6.99',
        'kafe falas me ëmbëlsirë',
        '-15% për studentë',
        'pije falas me menu',
        'sallatë falas me gjellë',
        'ëmbëlsira falas',
        '-30% pas orës 21:00',
        'brunch €5.99',
        'pizza e madhe €8.99',
        'burger + patate €7.50'
      ];

      const DAYS = ['E dielë', 'E hënë', 'E martë', 'E mërkurë', 'E enjte', 'E premte', 'E shtunë'];
      const MONTHS = ['janar', 'shkurt', 'mars', 'prill', 'maj', 'qershor', 'korrik', 'gusht', 'shtator', 'tetor', 'nëntor', 'dhjetor'];

      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('list');
      const noteEl = document.getElementById('note');
      const refreshEl = document.getElementById('refresh');

      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      function statusText(text, pulse) {
        const nodes = [];
        if (pulse) nodes.push(el('span', 'dot pulse'));
        nodes.push(el('span', '', text));
        statusEl.replaceChildren(...nodes);
      }

      function statusError(msg) {
        const a = el('a', '', 'provo përsëri');
        a.href = '#';
        a.addEventListener('click', (e) => { e.preventDefault(); run(); });
        statusEl.replaceChildren(el('span', 'dot hollow'), el('span', '', msg), a);
      }

      function getLocation() {
        return new Promise((resolve, reject) => {
          if (!('geolocation' in navigator)) {
            return reject(new Error('Shfletuesi nuk mbështet vendndodhjen'));
          }
          navigator.geolocation.getCurrentPosition(
            (p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
            (err) => {
              const msgs = {
                1: 'Vendndodhja u refuzua — lejoje në shfletues',
                2: 'Vendndodhja nuk është e disponueshme',
                3: 'Koha skadoi duke pritur vendndodhjen'
              };
              reject(new Error(msgs[err.code] || err.message));
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
          );
        });
      }

      function withTimeout(p, ms, msg) {
        return Promise.race([
          p,
          new Promise((_, reject) => setTimeout(() => reject(new Error(msg)), ms))
        ]);
      }

      function distM(a, b) {
        const R = 6371000;
        const toRad = (d) => d * Math.PI / 180;
        const dLat = toRad(b.lat - a.lat);
        const dLng = toRad(b.lng - a.lng);
        const s = Math.sin(dLat / 2) ** 2 +
                  Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(s));
      }

      function fmtDist(m) {
        return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1) + ' km';
      }

      function buildQuery(pos) {
        const amenityRe = '^(' + AMENITIES.join('|') + ')$';
        return '[out:json][timeout:20];(' +
          'node["amenity"~"' + amenityRe + '"](around:' + RADIUS_M + ',' + pos.lat + ',' + pos.lng + ');' +
          'way["amenity"~"' + amenityRe + '"](around:' + RADIUS_M + ',' + pos.lat + ',' + pos.lng + ');' +
          ');out center ' + MAX_RESULTS + ';';
      }

      async function overpassRequest(pos) {
        const body = 'data=' + encodeURIComponent(buildQuery(pos));
        let lastErr = null;
        for (const url of OVERPASS_URLS) {
          try {
            const res = await withTimeout(fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: body
            }), 20000, 'Overpass nuk u përgjigj në kohë');
            if (!res.ok) throw new Error('Overpass: ' + res.status);
            return await res.json();
          } catch (err) {
            lastErr = err;
          }
        }
        throw lastErr || new Error('Overpass nuk u përgjigj');
      }

      async function searchNearby(pos) {
        const data = await overpassRequest(pos);
        return (data.elements || [])
          .map((e) => {
            const lat = e.lat != null ? e.lat : (e.center && e.center.lat);
            const lng = e.lon != null ? e.lon : (e.center && e.center.lon);
            const t = e.tags || {};
            const cuisine = (t.cuisine || '').split(';')[0].replace(/_/g, ' ');
            const addr = [t['addr:street'], t['addr:housenumber']].filter(Boolean).join(' ');
            return {
              id: e.type + '/' + e.id,
              name: t.name,
              amenity: t.amenity,
              cuisine: cuisine,
              addr: addr,
              d: distM(pos, { lat: lat, lng: lng })
            };
          })
          .filter((p) => p.name)
          .sort((a, b) => a.d - b.d)
          .slice(0, MAX_RESULTS);
      }

      function hashStr(s) {
        let h = 2166136261;
        for (let i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return (h >>> 0);
      }

      function offerOfDay(placeId) {
        const now = new Date();
        const dayKey = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate();
        const h = hashStr((placeId || 'x') + '|' + dayKey);
        return OFFERS[h % OFFERS.length];
      }

      function todayLabel() {
        const now = new Date();
        return DAYS[now.getDay()] + ', ' + now.getDate() + ' ' + MONTHS[now.getMonth()];
      }

      const AMENITY_LABEL = { restaurant: 'restorant', fast_food: 'ushtim i shpejtë', cafe: 'kafe' };

      function rowEl(p, i) {
        const row = el('div', 'place');
        row.style.animationDelay = Math.min(i * 40, 600) + 'ms';

        const top = el('div', 'place-top');
        top.appendChild(el('span', 'dot'));

        const name = el('a', 'place-name', p.name);
        name.href = 'https://www.openstreetmap.org/' + p.id;
        name.target = '_blank';
        name.rel = 'noopener';
        top.appendChild(name);

        top.appendChild(el('span', 'dist', fmtDist(p.d)));
        row.appendChild(top);

        const bits = [];
        if (p.cuisine) bits.push(p.cuisine);
        if (AMENITY_LABEL[p.amenity]) bits.push(AMENITY_LABEL[p.amenity]);
        if (bits.length) row.appendChild(el('div', 'place-meta', bits.join(' · ')));

        const offer = el('span', 'offer');
        offer.appendChild(el('span', 'offer-label', 'sot'));
        offer.appendChild(document.createTextNode(offerOfDay(p.id)));
        row.appendChild(offer);

        if (p.addr) row.appendChild(el('div', 'place-addr', p.addr));
        return row;
      }

      function showResults(places, pos) {
        statusText(todayLabel() + ' · ' + (RADIUS_M / 1000).toFixed(1) + ' km · ' + places.length + ' vende', false);
        listEl.replaceChildren();
        noteEl.hidden = !places.length;
        if (!places.length) {
          listEl.appendChild(el('div', 'empty', '— Asnjë vend brenda ' + (RADIUS_M / 1000).toFixed(1) + ' km'));
          return;
        }
        places.forEach((p, i) => listEl.appendChild(rowEl(p, i)));
      }

      async function run() {
        listEl.replaceChildren();
        statusText('duke gjetur vendndodhjen…', true);
        try {
          const pos = await getLocation();
          statusText('duke kërkuar restorantet…', true);
          const places = await searchNearby(pos);
          showResults(places, pos);
        } catch (err) {
          statusError('— ' + (err && err.message ? err.message : 'gabim i panjohur'));
        }
      }

      refreshEl.addEventListener('click', (e) => { e.preventDefault(); run(); });
      run();
    })();
  </script>
</body>
</html>
