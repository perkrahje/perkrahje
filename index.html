<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PERKRAHJE</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0e0e10;
      --text: #ececec;
      --subtle: #8a8a8a;
      --line: #2a2a2a;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: 480px;
      width: 90vw;
      opacity: 0;
      transform: translateY(16px);
      animation: appear 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }


    .name {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 200;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 14px;
    }


    .rule {
      width: 100%;
      height: 1px;
      background: var(--line);
      margin-bottom: 20px;
    }

    .info-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text);
      flex-shrink: 0;
    }


    .info-row a,
    .info-row span {
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      font-weight: 300;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.04em;
      border-bottom: 1px solid transparent;
      padding-bottom: 1px;
      transition: border-color 0.25s ease;
    }

    .info-row span {
      color: var(--subtle);
    }

    .info-row a:hover {
      border-color: var(--text);
    }


    @keyframes appear {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="name">perkrahje.com</div>

    <div class="rule"></div>

    <div class="info-block">
      <div class="info-row">
        <div class="dot"></div>
        <a href="mailto:valon@perkrahje.com">valon@perkrahje.com</a>
      </div>
    </div>
  </div>
</body>
</html>
